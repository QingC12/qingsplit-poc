name: Build SwitcherProbe (Phase0 read-only)

on:
  push:
    branches: [ switcher-route ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid make

      - name: Compile SwitcherProbe arm64e dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          export SDKROOT="$SDK"
          xcrun --sdk iphoneos clang -arch arm64e -isysroot "$SDK" -fobjc-arc -miphoneos-version-min=15.0 -fmodules -c SwitcherProbe.m -o SwitcherProbe.o
          xcrun --sdk iphoneos clang -arch arm64e -isysroot "$SDK" -miphoneos-version-min=15.0 -dynamiclib -Xlinker -fixup_chains -install_name "/Library/MobileSubstrate/DynamicLibraries/SwitcherProbe.dylib" -framework Foundation -framework UIKit SwitcherProbe.o -o SwitcherProbe.dylib
          file SwitcherProbe.dylib
          ldid -S SwitcherProbe.dylib

      - name: Package probe deb
        run: python3 probe_package.py

      - name: Upload probe deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitcherProbe-deb
          path: SwitcherProbe_0.1.0_iphoneos-arm64e.deb
          if-no-files-found: warn
