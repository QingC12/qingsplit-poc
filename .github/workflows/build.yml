name: Build QingSplitPOC (arm64e new-ABI)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ldid
        run: |
          brew install ldid make

      - name: Show Xcode & SDK
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile arm64e (new ABI) dylib with Xcode clang/ld
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"
          export SDKROOT="$SDK"

          # 编译 ObjC 源文件为 arm64e 目标文件
          xcrun --sdk iphoneos clang \
            -arch arm64e \
            -isysroot "$SDK" \
            -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -fmodules \
            -c QingSplitPOC.m \
            -o QingSplitPOC.o

          # 用 Xcode 原生 ld 链接出 dylib（带 chained fixups / caps 0x2）
          xcrun --sdk iphoneos clang \
            -arch arm64e \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -Xlinker -fixup_chains \
            -install_name "/Library/MobileSubstrate/DynamicLibraries/QingSplitPOC.dylib" \
            -framework Foundation \
            -framework UIKit \
            QingSplitPOC.o \
            -o QingSplitPOC.dylib

          echo "=== dylib 架构验证（期望 arm64e / caps: 0x2）==="
          file QingSplitPOC.dylib
          echo "=== 检查 load commands（看是否有 LC_DYLD_CHAINED_FIXUPS）==="
          otool -l QingSplitPOC.dylib | grep -A2 -i "chained"

      - name: Sign dylib
        run: |
          ldid -S QingSplitPOC.dylib

      # v0.4.42: PreferenceBundles 可执行 —— 动态继承 PSListController（无私有头依赖），
      # 输出到 bundle 内（bundle 可执行须与 bundle 同名、无扩展名）
      # v0.4.42 修复白屏：PSCellType 是 int 枚举（PSGroupCell=8/PSSwitchCell=4/PSEditTextCell=2），
      # 之前传 NSString 在 arm64 上截断成随机 int → PSSpecifier 渲染异常 → 白屏；
      # 另加 /var/mobile/QingSplitPrefs.log 调试日志区分 dlopen 失败 / 类渲染失败
      - name: Build PreferenceBundle executable
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cat > QingSplitPrefsRootListController.m <<'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/message.h>
          #import <objc/runtime.h>
          #import <stdarg.h>

          static void qs_log(NSString *fmt, ...) {
              @try {
                  va_list ap; va_start(ap, fmt);
                  NSString *msg = [[NSString alloc] initWithFormat:fmt arguments:ap];
                  va_end(ap);
                  msg = [msg stringByAppendingString:@"\n"];
                  NSFileHandle *fh = [NSFileHandle fileHandleForWritingAtPath:@"/var/mobile/QingSplitPrefs.log"];
                  if (!fh) {
                      [msg writeToFile:@"/var/mobile/QingSplitPrefs.log" atomically:YES encoding:NSUTF8StringEncoding error:NULL];
                  } else {
                      [fh seekToEndOfFile];
                      [fh writeData:[msg dataUsingEncoding:NSUTF8StringEncoding]];
                      [fh closeFile];
                  }
              } @catch (NSException *e) {}
          }

          // v0.4.48: 主页面只保留 link 子页入口——开关全部挪进子页 plist（PSSwitchCell 字符串）
          // 子页由 Settings 原生解析（FloatingView 同结构），开关点击由 framework 处理，不再经过动态构造
          // （v0.4.45/47 实测：动态 switch cell=4 渲染正确但点击无 SET_CALLED → iOS17 不回调动态 target/setter）
          static id qs_prop(id spec, id value, NSString *key) {
              void (*setProp)(id, SEL, id, id) = (void(*)(id, SEL, id, id))objc_msgSend;
              setProp(spec, NSSelectorFromString(@"setProperty:forKey:"), value, key);
          }
          // v0.4.50: 完全对齐 FloatingView 设置结构——动态类无法被 [NSBundle bundleForClass:] 关联
          // → loadSpecifiersFromPlistName: 找不到 bundle、PSChildPane link 被判不可用（灰色/点击无反应）
          // 解法：① swizzle NSBundle bundleForClass: 对 QingSplitPrefsRootListController 返回本 bundle
          //       ② specifiers 改调 loadSpecifiersFromPlistName:@"Root"（官方数组+字符串 cell，framework 原生解析渲染/点击/写入）
          //       ③ 保留 PSListController setPreferenceValue:specifier: swizzle 作写入保底 + SET_CALLED 日志
          static NSBundle *(*qs_orig_bundleForClass)(Class, SEL, Class) = NULL;
          static NSBundle *qs_swz_bundleForClass(Class self, SEL _cmd, Class cls) {
              if (cls && strcmp(class_getName(cls), "QingSplitPrefsRootListController") == 0) {
                  static NSBundle *our = nil;
                  if (!our) our = [NSBundle bundleWithPath:@"/var/jb/Library/PreferenceBundles/QingSplitPrefs.bundle"];
                  if (our) return our;
              }
              return qs_orig_bundleForClass(self, _cmd, cls);
          }
          static IMP qs_orig_setpref = NULL;
          static void qs_swz_setpref(id self, SEL _cmd, id value, id spec) {
              @try {
                  id key = nil, defaults = nil;
                  if (spec) {
                      key = [spec performSelector:@selector(propertyForKey:) withObject:@"key"];
                      defaults = [spec performSelector:@selector(propertyForKey:) withObject:@"defaults"];
                  }
                  qs_log(@"SET_CALLED key=%@ val=%@ defaults=%@\n", key, value, defaults);
                  if (key && defaults) {
                      NSUserDefaults *ud = [[NSUserDefaults alloc] initWithSuiteName:defaults];
                      [ud setObject:value forKey:key];
                      [ud synchronize];
                  }
              } @catch (NSException *e) { qs_log(@"SET_EXC %@\n", e.name); }
              if (qs_orig_setpref) {
                  ((void(*)(id, SEL, id, id))qs_orig_setpref)(self, _cmd, value, spec);
              }
          }
          // v0.4.52: 不依赖 bundleForClass swizzle 是否被 loadSpecifiersFromPlistName: 内部采用
          // 直接调用带 bundle 参数的变体 loadSpecifiersFromPlistName:target:bundle:，显式传我们的 bundle（确定性路径）
          static id qs_specifiers(id self, SEL _cmd) {
              qs_log(@"SPECIFIERS_CALLED pid=%d\n", getpid());
              id sp = nil;
              NSBundle *our = [NSBundle bundleWithPath:@"/var/jb/Library/PreferenceBundles/QingSplitPrefs.bundle"];
              if (our) {
                  qs_log(@"BUNDLE_PATH_OK %@\n", [our bundlePath]);
                  NSString *rp = [our pathForResource:@"Root" ofType:@"plist"];
                  qs_log(@"ROOT_PLIST_PATH %@\n", rp ? rp : @"NIL");
                  @try {
                      SEL loadSel2 = NSSelectorFromString(@"loadSpecifiersFromPlistName:target:bundle:");
                      if ([self respondsToSelector:loadSel2]) {
                          id (*load2)(id, SEL, id, id, id) = (id(*)(id, SEL, id, id, id))objc_msgSend;
                          sp = load2(self, loadSel2, @"Root", self, our);
                          qs_log(@"LOAD2_COUNT %lu\n", (unsigned long)[(id)sp count]);
                      } else {
                          qs_log(@"LOAD2_METHOD_MISSING\n");
                          SEL loadSel1 = NSSelectorFromString(@"loadSpecifiersFromPlistName:target:");
                          if ([self respondsToSelector:loadSel1]) {
                              id (*load1)(id, SEL, id, id) = (id(*)(id, SEL, id, id))objc_msgSend;
                              sp = load1(self, loadSel1, @"Root", self);
                          } else {
                              qs_log(@"LOAD1_METHOD_MISSING\n");
                          }
                      }
                  } @catch (NSException *e) {
                      qs_log(@"LOAD_EXC %@\n", e.name);
                      sp = nil;
                  }
              } else {
                  qs_log(@"BUNDLE_PATH_FAIL\n");
              }
              if (!sp) {
                  qs_log(@"LOAD_FAILED Root.plist\n");
                  sp = @[];
              } else {
                  qs_log(@"SPECIFIERS_BUILT count=%lu\n", (unsigned long)[sp count]);
              }
              @try { [self setValue:sp forKey:@"_specifiers"]; } @catch (NSException *e) {}
              return sp;
          }

          __attribute__((constructor))
          static void qs_prefs_bundle_init(void) {
              qs_log(@"PREFS_BUNDLE_LOADED pid=%d\n", getpid());
              Class ps = NSClassFromString(@"PSListController");
              if (!ps) { qs_log(@"NO_PSLISTCONTROLLER\n"); return; }
              // bundleForClass swizzle：让动态类关联到本 bundle（loadSpecifiersFromPlistName 依赖）
              Method mb = class_getClassMethod([NSBundle class], @selector(bundleForClass:));
              if (mb) {
                  qs_orig_bundleForClass = (NSBundle *(*)(Class, SEL, Class))method_getImplementation(mb);
                  method_setImplementation(mb, (IMP)qs_swz_bundleForClass);
                  qs_log(@"BUNDLE_SWIZZLED\n");
              } else {
                  qs_log(@"BUNDLE_SWIZZLE_FAIL\n");
              }
              // setPreferenceValue swizzle：开关写入保底 + 日志
              Method m = class_getInstanceMethod(ps, NSSelectorFromString(@"setPreferenceValue:specifier:"));
              if (m) {
                  qs_orig_setpref = method_getImplementation(m);
                  method_setImplementation(m, (IMP)qs_swz_setpref);
                  qs_log(@"SET_SWIZZLED\n");
              } else {
                  qs_log(@"SET_METHOD_MISSING\n");
              }
              Class sub = objc_allocateClassPair(ps, "QingSplitPrefsRootListController", 0);
              if (sub) {
                  class_addMethod(sub, @selector(specifiers), (IMP)qs_specifiers, "@@:");
                  objc_registerClassPair(sub);
                  qs_log(@"CLASS_REGISTERED QingSplitPrefsRootListController\n");
              } else {
                  qs_log(@"CLASS_EXISTS\n");
              }
          }
          EOF
          # v0.4.44: 编译 fat 双架构（arm64 + arm64e，对齐 FloatingView universal binary），再 lipo 合成
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -Xlinker -fixup_chains \
            QingSplitPrefsRootListController.m \
            -framework Foundation \
            -framework UIKit \
            -o QingSplitPrefs_arm64.dylib
          xcrun --sdk iphoneos clang \
            -arch arm64e \
            -isysroot "$SDK" \
            -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -Xlinker -fixup_chains \
            QingSplitPrefsRootListController.m \
            -framework Foundation \
            -framework UIKit \
            -o QingSplitPrefs_arm64e.dylib
          lipo -create QingSplitPrefs_arm64.dylib QingSplitPrefs_arm64e.dylib -output QingSplitPrefs.bundle/QingSplitPrefs
          ldid -S QingSplitPrefs.bundle/QingSplitPrefs
          file QingSplitPrefs.bundle/QingSplitPrefs
          ls -l QingSplitPrefs.bundle/

      - name: Package deb (var/jb rootless layout)
        run: |
          python3 package.py

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingSplitPOC-deb
          path: |
            QingSplitPOC_0.4.52_iphoneos-arm64e.deb
          if-no-files-found: warn
