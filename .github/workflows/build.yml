name: Build QingSplitPOC (arm64e new-ABI)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ldid
        run: |
          brew install ldid make

      - name: Show Xcode & SDK
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile arm64e (new ABI) dylib with Xcode clang/ld
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"
          export SDKROOT="$SDK"

          # 编译 ObjC 源文件为 arm64e 目标文件
          xcrun --sdk iphoneos clang \
            -arch arm64e \
            -isysroot "$SDK" \
            -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -fmodules \
            -c QingSplitPOC.m \
            -o QingSplitPOC.o

          # 用 Xcode 原生 ld 链接出 dylib（带 chained fixups / caps 0x2）
          xcrun --sdk iphoneos clang \
            -arch arm64e \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -Xlinker -fixup_chains \
            -install_name "/Library/MobileSubstrate/DynamicLibraries/QingSplitPOC.dylib" \
            -framework Foundation \
            -framework UIKit \
            QingSplitPOC.o \
            -o QingSplitPOC.dylib

          echo "=== dylib 架构验证（期望 arm64e / caps: 0x2）==="
          file QingSplitPOC.dylib
          echo "=== 检查 load commands（看是否有 LC_DYLD_CHAINED_FIXUPS）==="
          otool -l QingSplitPOC.dylib | grep -A2 -i "chained"

      - name: Sign dylib
        run: |
          ldid -S QingSplitPOC.dylib

      # v0.4.42: PreferenceBundles 可执行 —— 动态继承 PSListController（无私有头依赖），
      # 输出到 bundle 内（bundle 可执行须与 bundle 同名、无扩展名）
      # v0.4.42 修复白屏：PSCellType 是 int 枚举（PSGroupCell=8/PSSwitchCell=4/PSEditTextCell=2），
      # 之前传 NSString 在 arm64 上截断成随机 int → PSSpecifier 渲染异常 → 白屏；
      # 另加 /var/mobile/QingSplitPrefs.log 调试日志区分 dlopen 失败 / 类渲染失败
      - name: Build PreferenceBundle executable
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cat > QingSplitPrefsRootListController.m <<'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/message.h>
          #import <objc/runtime.h>
          #import <stdarg.h>

          static void qs_log(NSString *fmt, ...) {
              @try {
                  va_list ap; va_start(ap, fmt);
                  NSString *msg = [[NSString alloc] initWithFormat:fmt arguments:ap];
                  va_end(ap);
                  msg = [msg stringByAppendingString:@"\n"];
                  NSFileHandle *fh = [NSFileHandle fileHandleForWritingAtPath:@"/var/mobile/QingSplitPrefs.log"];
                  if (!fh) {
                      [msg writeToFile:@"/var/mobile/QingSplitPrefs.log" atomically:YES encoding:NSUTF8StringEncoding error:NULL];
                  } else {
                      [fh seekToEndOfFile];
                      [fh writeData:[msg dataUsingEncoding:NSUTF8StringEncoding]];
                      [fh closeFile];
                  }
              } @catch (NSException *e) {}
          }

          // v0.4.48: 主页面只保留 link 子页入口——开关全部挪进子页 plist（PSSwitchCell 字符串）
          // 子页由 Settings 原生解析（FloatingView 同结构），开关点击由 framework 处理，不再经过动态构造
          // （v0.4.45/47 实测：动态 switch cell=4 渲染正确但点击无 SET_CALLED → iOS17 不回调动态 target/setter）
          static id qs_prop(id spec, id value, NSString *key) {
              void (*setProp)(id, SEL, id, id) = (void(*)(id, SEL, id, id))objc_msgSend;
              setProp(spec, NSSelectorFromString(@"setProperty:forKey:"), value, key);
          }
          // v0.4.50: 完全对齐 FloatingView 设置结构——动态类无法被 [NSBundle bundleForClass:] 关联
          // → loadSpecifiersFromPlistName: 找不到 bundle、PSChildPane link 被判不可用（灰色/点击无反应）
          // 解法：① swizzle NSBundle bundleForClass: 对 QingSplitPrefsRootListController 返回本 bundle
          //       ② specifiers 改调 loadSpecifiersFromPlistName:@"Root"（官方数组+字符串 cell，framework 原生解析渲染/点击/写入）
          //       ③ 保留 PSListController setPreferenceValue:specifier: swizzle 作写入保底 + SET_CALLED 日志
          static NSBundle *(*qs_orig_bundleForClass)(Class, SEL, Class) = NULL;
          static NSBundle *qs_swz_bundleForClass(Class self, SEL _cmd, Class cls) {
              if (cls) {
                  const char *cn = class_getName(cls);
                  // v0.4.86: 子页 QSTargetsController 同样需要 bundle 关联（否则 push 实例化崩，日志只到 BUNDLE_PATH_OK）
                  if (strcmp(cn, "QingSplitPrefsRootListController") == 0 || strcmp(cn, "QSTargetsController") == 0) {
                      static NSBundle *our = nil;
                      if (!our) our = [NSBundle bundleWithPath:@"/var/jb/Library/PreferenceBundles/QingSplitPrefs.bundle"];
                      if (our) return our;
                  }
              }
              return qs_orig_bundleForClass(self, _cmd, cls);
          }
          static char kKeyAO; static char kDefaultsAO;
          static IMP qs_orig_setpref = NULL;
          static IMP qs_orig_cellForRow = NULL;
          // v0.4.61 渲染探针：cellForRowAtIndexPath: 打印真实渲染 cell 类 + spec key（iOS17 完整枚举映射，一次拿全）
          static id qs_swz_cellForRow(id self, SEL _cmd, id tableView, id indexPath) {
              id cell = ((id(*)(id, SEL, id, id))qs_orig_cellForRow)(self, _cmd, tableView, indexPath);
              @try {
                  id spec = nil;
                  if (cell) spec = [cell valueForKey:@"specifier"];
                  if (spec) {
                      id ident = [spec valueForKey:@"identifier"];
                      NSString *tag = @"";
                      if ([ident isKindOfClass:[NSString class]]) tag = ident;
                      int ct = 0;
                      @try { ct = [[spec valueForKey:@"cellType"] intValue]; } @catch (NSException *e) {}
                      qs_log(@"CELL_RENDER ident=%@ cellType=%d cellClass=%@\n",
                             tag, ct, cell ? NSStringFromClass([cell class]) : @"nil");
                  }
              } @catch (NSException *e) { qs_log(@"CELLRENDER_EXC %@\n", e.name); }
              return cell;
          }
          static IMP qs_orig_readpref = NULL;
          // v0.4.55: 开关写入 —— iOS17 点击开关时传入的 spec 是内部对象（AO/propertyForKey 均读不到 key）
          // key 改从 identifier 读（构造时 set 的 qs_<key>，iOS 必保留）；写入直接落 SpringBoard 读取的同一 plist 文件
          static NSString *qs_cfg_path(void) {
              return @"/var/mobile/Library/Preferences/com.qingsplit.poc.plist";
          }
          // v0.4.59: Preferences 进程有沙盒，writeToFile 直接写 /var/mobile/... 被静默拒绝（plutil 证明文件不存在）
          // 唯一正道：CFPreferencesSetAppValue（cfprefsd 守护进程写入，无沙盒限制），SpringBoard 读同一域落盘文件
          static void qs_write_cfg(NSString *key, id value) {
              CFPreferencesSetAppValue((__bridge CFStringRef)key, (__bridge CFPropertyListRef)value, CFSTR("com.qingsplit.poc"));
              CFPreferencesAppSynchronize(CFSTR("com.qingsplit.poc"));
              qs_log(@"CF_WRITE key=%@ val=%@\n", key, value);
              // v0.4.69: 文件双写 —— 读不到文件内容时绝不覆盖（保留 CF_WRITE 与已有 target_*）
              @try {
                  NSString *path = qs_cfg_path();
                  NSMutableDictionary *pd = [NSMutableDictionary dictionaryWithContentsOfFile:path];
                  if (pd) {
                      pd[key] = value;
                      if ([pd writeToFile:path atomically:YES]) {
                          qs_log(@"FILE_WRITE key=%@ val=%@\n", key, value);
                      } else {
                          qs_log(@"FILE_WRITE_FAIL key=%@\n", key);
                      }
                  } else {
                      qs_log(@"FILE_WRITE_SKIP unreadable key=%@\n", key);
                  }
                  // v0.4.71: 写 target_* 时聚合 targets 字符串 —— 基于 CFPreferences 旧值合并（不依赖文件可读）
                  if ([key hasPrefix:@"target_"]) {
                      NSString *bid = [key substringFromIndex:7];
                      NSMutableArray *on = [NSMutableArray array];
                      CFTypeRef oldV = CFPreferencesCopyAppValue(CFSTR("targets"), CFSTR("com.qingsplit.poc"));
                      if (oldV && CFGetTypeID(oldV) == CFStringGetTypeID()) {
                          NSString *oldTs = (__bridge NSString *)oldV;
                          for (NSString *w in [oldTs componentsSeparatedByString:@","]) {
                              NSString *t = [w stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
                              if (t.length && ![on containsObject:t]) [on addObject:t];
                          }
                      }
                      if ([value boolValue]) {
                          if (![on containsObject:bid]) [on addObject:bid];
                      } else {
                          [on removeObject:bid];
                      }
                      NSString *joined = [on componentsJoinedByString:@","];
                      CFPreferencesSetAppValue(CFSTR("targets"), (__bridge CFPropertyListRef)joined, CFSTR("com.qingsplit.poc"));
                      CFPreferencesAppSynchronize(CFSTR("com.qingsplit.poc"));
                      qs_log(@"TARGETS_AGG %@\n", joined);
                  }
              } @catch (NSException *e) { qs_log(@"FILE_WRITE_EXC %@\n", e.name); }
          }
          static id qs_read_cfg(NSString *key) {
              CFTypeRef v = CFPreferencesCopyAppValue((__bridge CFStringRef)key, CFSTR("com.qingsplit.poc"));
              if (v) return (__bridge id)v;
              return nil;
          }
          // 从（iOS17 加工后的）spec 取 key —— v0.4.58 由 SET_DUMP 数据推出：
          // spec.props 有 cellObject=PSSwitchTableCell / control=UISwitch，cell 有公开 specifier 属性指向原 spec（AO key 在其上）
          static id qs_key_from_spec(id self, id spec) {
              if (!spec) return nil;
              // ① cellObject → cell.specifier → AO
              @try {
                  id cellObj = [spec performSelector:@selector(propertyForKey:) withObject:@"cellObject"];
                  if (cellObj) {
                      id os = [cellObj valueForKey:@"specifier"];
                      if (os) {
                          id ao = objc_getAssociatedObject(os, &kKeyAO);
                          if (ao) { qs_log(@"KEY_VIA_CELLSPEC %@\n", ao); return ao; }
                      }
                  }
              } @catch (NSException *e) { qs_log(@"CELLSPEC_EXC %@\n", e.name); }
              // ② control → superview(cell) → specifier → AO
              @try {
                  id ctl = [spec performSelector:@selector(propertyForKey:) withObject:@"control"];
                  if (ctl) {
                      id cellV = [ctl superview];
                      if (cellV) {
                          id os = [cellV valueForKey:@"specifier"];
                          if (os) {
                              id ao = objc_getAssociatedObject(os, &kKeyAO);
                              if (ao) { qs_log(@"KEY_VIA_CONTROL %@\n", ao); return ao; }
                          }
                      }
                  }
              } @catch (NSException *e) { qs_log(@"CONTROL_EXC %@\n", e.name); }
              // ③ identifier（qs_ 前缀，KVC 读）
              @try {
                  id ident = [spec valueForKey:@"identifier"];
                  if ([ident isKindOfClass:[NSString class]] && [ident hasPrefix:@"qs_"]) {
                      return [ident substringFromIndex:3];
                  }
              } @catch (NSException *e) {}
              // ④ name 匹配 controller.specifiers → 原 spec AO
              @try {
                  NSString *name = [spec valueForKey:@"name"];
                  if (name) {
                      NSArray *specs = [self valueForKey:@"specifiers"];
                      for (id s in specs) {
                          NSString *sname = [s valueForKey:@"name"];
                          if (sname && [sname isEqualToString:name]) {
                              id ao = objc_getAssociatedObject(s, &kKeyAO);
                              if (ao) return ao;
                          }
                      }
                  }
              } @catch (NSException *e) {}
              return nil;
          }
          static void qs_swz_setpref(id self, SEL _cmd, id value, id spec) {
              @try {
                  // === 决定性 dump：看清传入 spec 上到底有什么 ===
                  qs_log(@"SET_DUMP spec=%p class=%@\n", (__bridge void*)spec, spec ? NSStringFromClass([spec class]) : @"nil");
                  if (spec) {
                      @try { qs_log(@"SET_DUMP name=%@\n", [spec valueForKey:@"name"]); } @catch (NSException *e) { qs_log(@"DUMP name EXC\n"); }
                      @try { qs_log(@"SET_DUMP ident=%@\n", [spec valueForKey:@"identifier"]); } @catch (NSException *e) { qs_log(@"DUMP ident EXC\n"); }
                      @try { qs_log(@"SET_DUMP propKey=%@\n", [spec performSelector:@selector(propertyForKey:) withObject:@"key"]); } @catch (NSException *e) { qs_log(@"DUMP propKey EXC\n"); }
                      @try { qs_log(@"SET_DUMP propLabel=%@\n", [spec performSelector:@selector(propertyForKey:) withObject:@"label"]); } @catch (NSException *e) { qs_log(@"DUMP label EXC\n"); }
                      @try { qs_log(@"SET_DUMP props=%@\n", [spec valueForKey:@"properties"]); } @catch (NSException *e) { qs_log(@"DUMP props EXC\n"); }
                  }
                  id key = qs_key_from_spec(self, spec);
                  qs_log(@"SET_CALLED key=%@ val=%@ defaults=com.qingsplit.poc\n", key, value);
                  if (key) {
                      qs_write_cfg(key, value);
                  }
              } @catch (NSException *e) { qs_log(@"SET_EXC %@\n", e.name); }
              if (qs_orig_setpref) {
                  @try { ((void(*)(id, SEL, id, id))qs_orig_setpref)(self, _cmd, value, spec); }
                  @catch (NSException *e) { qs_log(@"ORIG_SET_EXC %@\n", e.name); }
              }
          }
          // readPreferenceValue: —— 开关读回（非 qs_ spec 走 original，避免影响全局设置页）
          static id qs_readpref(id self, SEL _cmd, id specifier) {
              @try {
                  id key = qs_key_from_spec(self, specifier);
                  if (key) {
                      id v = qs_read_cfg(key);
                      if (v) {
                          qs_log(@"READ_CFG key=%@ val=%@\n", key, v);
                          return v;
                      }
                  }
              } @catch (NSException *e) { qs_log(@"READ_EXC %@\n", e.name); }
              if (qs_orig_readpref) return ((id(*)(id, SEL, id))qs_orig_readpref)(self, _cmd, specifier);
              return nil;
          }
          // v0.4.53: bundleWithPath 硬编码路径在 Preferences 进程不可见（BUNDLE_PATH_FAIL）
          // 从 dyld image 推导 bundle 路径（executable 已加载，其路径一定可见）；再优先 loadSpecifiersFromPlistName:target:bundle:
          // 若 bundleWithPath 仍失败 → 手动解析 Root.plist 并手动构造 PSSpecifier（cell 枚举按 libprefs 标准 + 读回 cellType 校准日志）
          extern uint32_t _dyld_image_count(void);
          extern const char *_dyld_get_image_name(uint32_t index) __attribute__((weak));
          static NSString *qs_bundle_path(void) {
              uint32_t cnt = _dyld_image_count();
              for (uint32_t i = 0; i < cnt; i++) {
                  const char *name = _dyld_get_image_name(i);
                  if (name && strstr(name, "QingSplitPrefs.bundle/QingSplitPrefs")) {
                      NSString *s = [NSString stringWithUTF8String:name];
                      return [s stringByDeletingLastPathComponent];
                  }
              }
              return nil;
          }
          // v0.4.60: 手动构造 PSSpecifier
          // iOS17 cell 枚举实测（SET_DUMP 数据）：6=PSSwitchCell（真开关，带 UISwitch）/ 3=PSGroupCell / 2=PSLinkCell（点击进空页）
          // PSEditTextCell=1 候选；libprefs 的 group=6/switch=3 在 iOS17 完全相反
          // key/defaults 用 associated object 存（propertyForKey: 读回 null，保底写入会失败）
          static id qs_mk_spec(Class PS, id target, id dict) {
              NSString *cellStr = [dict objectForKey:@"cell"];
              NSString *label = [dict objectForKey:@"label"];
              NSString *key = [dict objectForKey:@"key"];
              NSString *defaults = [dict objectForKey:@"defaults"];
              int cell = 0;
              // v0.4.60: cell 枚举按 SET_DUMP 实测修正 —— iOS17 与 libprefs 相反：6=PSSwitchCell(真开关)、3=PSGroupCell
              //（v0.4.53 传 6 渲染成 PSSwitchTableCell+UISwitch 且可点出 SET_CALLED；传 3 渲染成 group 不可点，用户只见 2 个"开关"= 2 个 group）
              if ([cellStr isEqualToString:@"PSGroupCell"]) cell = 3;
              else if ([cellStr isEqualToString:@"PSSwitchCell"]) cell = 6;
              else if ([cellStr isEqualToString:@"PSEditTextCell"]) cell = 0;   // 候选 edit（1/2 已证是 link 进空页；0 渲染异常无 CELL_RENDER）
              else if ([cellStr isEqualToString:@"PSLinkCell"]) cell = 2;
              SEL mkSel = NSSelectorFromString(@"preferenceSpecifierNamed:target:set:get:detail:cell:edit:");
              if (![PS respondsToSelector:mkSel]) { qs_log(@"MK_MISSING\n"); return nil; }
              id (*mk)(id, SEL, id, id, SEL, SEL, id, int, id) = (id(*)(id, SEL, id, id, SEL, SEL, id, int, id))objc_msgSend;
              SEL setSel = NSSelectorFromString(@"setPreferenceValue:specifier:");
              SEL getSel = NSSelectorFromString(@"readPreferenceValue:");
              // v0.4.64: detail 走官方构造参数（第 7 参数传 Class 对象）—— 手动 setProperty 字符串会被 iOS17 当 Class 指针用 → 崩
              Class detailClass = nil;
              id det = [dict objectForKey:@"detail"];
              if (det) detailClass = NSClassFromString(det);
              id spec = mk(PS, mkSel, label, target, setSel, getSel, detailClass, cell, nil);
              if (!spec) { qs_log(@"MK_RETURN_NIL %@\n", cellStr); return nil; }
              void (*setProp)(id, SEL, id, id) = (void(*)(id, SEL, id, id))objc_msgSend;
              SEL spSel = NSSelectorFromString(@"setProperty:forKey:");
              if (key) setProp(spec, spSel, key, @"key");
              if (defaults) setProp(spec, spSel, defaults, @"defaults");
              id defv = [dict objectForKey:@"default"];
              if (defv) setProp(spec, spSel, defv, @"default");
              id ph = [dict objectForKey:@"placeholder"];
              if (ph) setProp(spec, spSel, ph, @"placeholder");
              id ft = [dict objectForKey:@"footerText"];
              if (ft) setProp(spec, spSel, ft, @"footerText");
              id ict = [dict objectForKey:@"isController"];
              if (ict) setProp(spec, spSel, ict, @"isController");
              if (key) {
                  objc_setAssociatedObject(spec, &kKeyAO, key, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  // identifier 存 qs_<key>：走 setIdentifier: setter（copy 属性，副本保留），写入/读回都从它取 key
                  @try { [spec setValue:[@"qs_" stringByAppendingString:key] forKey:@"identifier"]; }
                  @catch (NSException *e) { qs_log(@"IDENT_SET_EXC %@\n", e.name); }
              }
              if (defaults) objc_setAssociatedObject(spec, &kDefaultsAO, defaults, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              // 构造后 dump 验证：我们自己的 spec 上 key/footerText 到底在不在（区分"构造时丢失"vs"cell 加工时丢失"）
              @try {
                  qs_log(@"BUILD_DUMP spec=%p key=%@ def=%@ ident=%@ footer=%@\n",
                         (__bridge void*)spec,
                         [spec performSelector:@selector(propertyForKey:) withObject:@"key"],
                         [spec performSelector:@selector(propertyForKey:) withObject:@"defaults"],
                         [spec valueForKey:@"identifier"],
                         [spec performSelector:@selector(propertyForKey:) withObject:@"footerText"]);
              } @catch (NSException *e) { qs_log(@"BUILD_DUMP_EXC %@\n", e.name); }
              return spec;
          }
          // v0.4.88: 公共应用枚举（子页列表 + 勾选共用）
          static NSArray *qs_enumerate_apps(void) {
              NSMutableArray *out_ = [NSMutableArray array];
              @try {
                  Class wsCls = NSClassFromString(@"LSApplicationWorkspace");
                  if (wsCls) {
                      id ws = [wsCls performSelector:@selector(defaultWorkspace)];
                      NSArray *apps = [ws performSelector:@selector(allApplications)];
                      for (id proxy in apps) {
                          NSString *bid = [proxy performSelector:@selector(bundleIdentifier)];
                          NSString *name = [proxy performSelector:@selector(localizedName)];
                          if (!bid.length || !name.length) continue;
                          if ([bid hasPrefix:@"com.apple."] && ![bid isEqualToString:@"com.apple.Preferences"]) continue;
                          [out_ addObject:@{@"name":name, @"bundle":bid}];
                      }
                  }
              } @catch (NSException *e) { qs_log(@"APPS_EXC %@\n", e.name); }
              // 按名称排序，选择器与设置一致
              [out_ sortUsingComparator:^NSComparisonResult(id a, id b){
                  return [a[@"name"] localizedCaseInsensitiveCompare:b[@"name"]];
              }];
              return out_;
          }
          static NSArray *qs_apps_cache(void);   // v0.4.88: 前向声明
          // v0.4.88: 子页开关变化 → 写 CFPreferences（与 SpringBoard 同一域）
          static void qs_t_sw_changed(id self, SEL _cmd, id sw) {
              long idx = [(UIView*)sw tag];
              NSArray *apps = qs_apps_cache();
              if (idx < 0 || idx >= (long)[apps count]) return;
              NSString *bid = apps[idx][@"bundle"];
              NSString *key = [@"target_" stringByAppendingString:bid];
              BOOL on = [(UISwitch*)sw isOn];
              CFPreferencesSetAppValue((__bridge CFStringRef)key, on ? kCFBooleanTrue : kCFBooleanFalse, CFSTR("com.qingsplit.poc"));
              CFPreferencesAppSynchronize(CFSTR("com.qingsplit.poc"));
              qs_log(@"TARGET_SW key=%@ on=%d\n", key, on);
          }
          static NSArray *qs_apps_cache(void) {
              static NSArray *cache = nil;
              if (!cache) cache = qs_enumerate_apps();
              return cache;
          }
          // v0.4.88: 自绘子页 cell（图标+名称+UISwitch，完全脱离 Settings spec 渲染）
          static id qs_t_cell(id self, SEL _cmd, id tv, id ip) {
              long row = (long)[(NSIndexPath*)ip row];
              NSArray *apps = qs_apps_cache();
              if (row >= (long)[apps count]) return [[UITableViewCell alloc] init];
              NSDictionary *app = apps[row];
              NSString *bid = app[@"bundle"];
              NSString *key = [@"target_" stringByAppendingString:bid];
              UITableViewCell *c = [tv dequeueReusableCellWithIdentifier:@"qsc"];
              if (!c) c = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:@"qsc"];
              c.textLabel.text = app[@"name"];
              c.textLabel.font = [UIFont systemFontOfSize:16];
              c.imageView.image = [UIImage performSelector:NSSelectorFromString(@"_applicationIconImageForBundleIdentifier:") withObject:bid];
              if (!c.imageView.image) c.imageView.image = [UIImage systemImageNamed:@"app"];
              UISwitch *sw = [[UISwitch alloc] init];
              sw.tag = (NSInteger)row;
              BOOL on = NO;
              CFTypeRef v = CFPreferencesCopyAppValue((__bridge CFStringRef)key, CFSTR("com.qingsplit.poc"));
              if (v) {
                  if (CFGetTypeID(v) == CFBooleanGetTypeID()) on = CFBooleanGetValue((CFBooleanRef)v);
                  CFRelease(v);
              }
              sw.on = on;
              [sw addTarget:self action:@selector(qs_t_sw_changed:) forControlEvents:UIControlEventValueChanged];
              c.accessoryView = sw;
              c.selectionStyle = UITableViewCellSelectionStyleNone;
              return c;
          }
          static long qs_t_numRows(id self, SEL _cmd, id tv) {
              return (long)[qs_apps_cache() count];
          }
          static long qs_t_numSec(id self, SEL _cmd, id tv) { return 1; }
          // v0.4.88: 子页初始化（标题 + 分组表格）
          static id qs_t_init_style(id self, SEL _cmd, NSInteger style) {
              qs_log(@"TARGETS_VC_INIT\n");
              self = ((id(*)(id, SEL, NSInteger))class_getMethodImplementation([UITableViewController class], @selector(initWithStyle:)))(self, _cmd, 1);
              [self setTitle:@"目标应用"];
              return self;
          }
          static IMP qs_orig_didSelect = NULL;
          static void qs_open_targets(id self, SEL _cmd, id spec);   // v0.4.89: 前向声明
          // v0.4.88: 入口行点击拦截 —— PSTableCell 渲染安全，点击后手动 push 自绘子页（绕开 detail-push 崩溃）
          static void qs_swz_didSelect(id self, SEL _cmd, id tv, id ip) {
              @try {
                  UITableViewCell *cell = [tv cellForRowAtIndexPath:ip];
                  id spec = cell ? [cell valueForKey:@"specifier"] : nil;
                  NSString *ident = spec ? [spec valueForKey:@"identifier"] : nil;
                  if ([ident isEqualToString:@"qs_targets_entry"]) {
                      qs_log(@"ENTRY_TAPPED\n");
                      qs_open_targets(self, @selector(qs_open_targets:), nil);
                      return;
                  }
              } @catch (NSException *e) { qs_log(@"DIDSEL_EXC %@\n", e.name); }
              if (qs_orig_didSelect) ((void(*)(id, SEL, id, id))qs_orig_didSelect)(self, _cmd, tv, ip);
          }
          // v0.4.88: 主页入口 action —— 手动 push 自绘子页（绕开 Settings detail-push）
          static void qs_open_targets(id self, SEL _cmd, id spec) {
              qs_log(@"OPEN_TARGETS\n");
              Class tc = NSClassFromString(@"QSTargetsListController");
              if (!tc) { qs_log(@"OPEN_TARGETS_NOCLASS\n"); return; }
              id vc = [[tc alloc] initWithStyle:1];
              UINavigationController *nc = (UINavigationController *)[self valueForKey:@"navigationController"];
              if (nc && vc) {
                  [nc pushViewController:vc animated:YES];
                  qs_log(@"OPEN_TARGETS_PUSHED\n");
              } else {
                  qs_log(@"OPEN_TARGETS_PUSH_FAIL nc=%@ vc=%@\n", nc, vc);
              }
          }
          // v0.4.87: 子页生命周期探针 —— 定位 push 崩溃发生在 init/loadView/viewDidLoad/specifiers 哪一步
          static id qs_t_init(id self, SEL _cmd) {
              qs_log(@"TARGETS_INIT_BEGIN\n");
              id r = ((id(*)(id, SEL))class_getMethodImplementation(NSClassFromString(@"PSListController"), @selector(init)))(self, _cmd);
              qs_log(@"TARGETS_INIT_END %@\n", r);
              return r;
          }
          static void qs_t_loadView(id self, SEL _cmd) {
              qs_log(@"TARGETS_LOADVIEW_BEGIN\n");
              ((void(*)(id, SEL))class_getMethodImplementation(NSClassFromString(@"PSViewController"), NSSelectorFromString(@"loadView")))(self, _cmd);
              qs_log(@"TARGETS_LOADVIEW_END\n");
          }
          static void qs_t_viewDidLoad(id self, SEL _cmd) {
              qs_log(@"TARGETS_VIEWDIDLOAD_BEGIN\n");
              ((void(*)(id, SEL))class_getMethodImplementation(NSClassFromString(@"PSViewController"), NSSelectorFromString(@"viewDidLoad")))(self, _cmd);
              qs_log(@"TARGETS_VIEWDIDLOAD_END\n");
          }
          // v0.4.63: 目标 App 子页 —— QSTargetsController 列出全部应用开关（cell=6 已证），写入 target_<bundleID>
          static id qs_target_specifiers(id self) {
              qs_log(@"TARGETS_START\n");
              NSMutableArray *arr = [NSMutableArray array];
              @try {
                  Class PS = NSClassFromString(@"PSSpecifier");
                  NSDictionary *g = @{@"cell":@"PSGroupCell", @"footerText":@"开启的应用会出现在右侧滑动选择器中，可作为悬浮窗目标"};
                  id gs = qs_mk_spec(PS, self, g);
                  if (gs) [arr addObject:gs];
                  NSArray *apps = qs_enumerate_apps();
                  qs_log(@"TARGETS_APPS %lu\n", (unsigned long)[apps count]);
                  for (NSDictionary *app in apps) {
                      NSDictionary *d = @{@"cell":@"PSSwitchCell", @"label":app[@"name"],
                                          @"key":[@"target_" stringByAppendingString:app[@"bundle"]],
                                          @"defaults":@"com.qingsplit.poc"};
                      id spec = qs_mk_spec(PS, self, d);
                      if (spec) [arr addObject:spec];
                  }
              } @catch (NSException *e) {
                  qs_log(@"TARGETS_EXC %@\n", e.name);
              }
              qs_log(@"TARGETS_BUILT %lu\n", (unsigned long)[arr count]);
              @try { [self setValue:arr forKey:@"_specifiers"]; } @catch (NSException *e) {}
              return arr;
          }
          // v0.4.85: 借鉴 Myrtle —— 主页只保留"目标应用"入口（PSLinkCell→子页 QSTargetsController）
          // 子页仅含 PSSwitchCell（渲染安全，主页 79 开关已验证）；不再平铺 79 开关，实现真正的父目录
          static void qs_add_target_switches(NSMutableArray *arr, Class PS, id self) {
              @try {
                  NSDictionary *entry = @{@"cell":@"PSTableCell", @"label":@"目标应用", @"key":@"targets_entry"};
                  id es = qs_mk_spec(PS, self, entry);
                  if (!es) { qs_log(@"TARGETS_ENTRY_FAIL\n"); return; }
                  // v0.4.88: 点击由 didSelect swizzle 拦截（identifier=qs_targets_entry），手动 push 自绘子页
                  // 插入到"目标应用"组头（index 2）之后
                  NSUInteger ins = 3;
                  if ((NSUInteger)[arr count] < ins) ins = (NSUInteger)[arr count];
                  [arr insertObject:es atIndex:ins];
                  qs_log(@"TARGETS_ENTRY_INSERTED at=%lu\n", (unsigned long)ins);
              } @catch (NSException *e) { qs_log(@"TARGETS_EXC %@\n", e.name); }
          }
          static id qs_specifiers(id self, SEL _cmd) {
              qs_log(@"SPECIFIERS_CALLED pid=%d\n", getpid());
              id sp = nil;
              NSString *bp = qs_bundle_path();
              qs_log(@"DYLD_BUNDLE_PATH %@\n", bp ? bp : @"NIL");
              if (bp) {
                  NSBundle *our = [NSBundle bundleWithPath:bp];
                  if (our) {
                      qs_log(@"BUNDLE_PATH_OK %@\n", bp);
                      @try {
                          SEL loadSel2 = NSSelectorFromString(@"loadSpecifiersFromPlistName:target:bundle:");
                          if ([self respondsToSelector:loadSel2]) {
                              id (*load2)(id, SEL, id, id, id) = (id(*)(id, SEL, id, id, id))objc_msgSend;
                              sp = load2(self, loadSel2, @"Root", self, our);
                              qs_log(@"LOAD2_COUNT %lu\n", (unsigned long)[(id)sp count]);
                          } else {
                              qs_log(@"LOAD2_METHOD_MISSING\n");
                          }
                      } @catch (NSException *e) { qs_log(@"LOAD2_EXC %@\n", e.name); }
                  } else {
                      qs_log(@"BUNDLE_PATH_FAIL dyld-derived\n");
                  }
              }
              if (sp && [(id)sp count] > 0) {
                  // v0.4.82: LOAD2 成功路径同样追加"目标应用"父分组 + 全部 target 开关（保证收纳生效）
                  NSMutableArray *arr2 = [NSMutableArray arrayWithArray:sp];
                  Class PS2 = NSClassFromString(@"PSSpecifier");
                  qs_add_target_switches(arr2, PS2, self);
                  sp = arr2;
              }
              if (!sp || (id)sp == (id)@[] || [(id)sp count] == 0) {
                  // 兜底：手动解析 Root.plist
                  NSString *plistPath = nil;
                  if (bp) plistPath = [bp stringByAppendingPathComponent:@"Root.plist"];
                  if (!plistPath || ![[NSFileManager defaultManager] fileExistsAtPath:plistPath]) {
                      qs_log(@"ROOT_PLIST_MISSING %@\n", plistPath ? plistPath : @"NIL");
                  } else {
                      qs_log(@"ROOT_PLIST_EXISTS\n");
                      NSDictionary *rootDict = [NSDictionary dictionaryWithContentsOfFile:plistPath];
                      NSArray *items = rootDict ? [rootDict objectForKey:@"PreferenceSpecifiers"] : nil;
                      if (!items) items = (id)rootDict;
                      qs_log(@"MANUAL_ITEMS %lu\n", (unsigned long)[(id)items count]);
                      Class PS = NSClassFromString(@"PSSpecifier");
                      NSMutableArray *arr = [NSMutableArray array];
                      for (id d in items) {
                          if ([d isKindOfClass:[NSDictionary class]]) {
                              id spec = qs_mk_spec(PS, self, d);
                              if (spec) {
                                  int ct = 0;
                                  @try { ct = [[spec valueForKey:@"cellType"] intValue]; } @catch (NSException *e) {}
                                  qs_log(@"MANUAL_SPEC cell=%@ type=%d\n", [d objectForKey:@"cell"], ct);
                                  [arr addObject:spec];
                              }
                          }
                      }
                      sp = arr;
                      // v0.4.65: 追加目标应用开关（cell=6 已验证，内嵌主设置页，跳过 link/detail）
                      qs_add_target_switches(arr, PS, self);
                  }
              }
              if (!sp) {
                  qs_log(@"LOAD_FAILED Root.plist\n");
                  sp = @[];
              } else {
                  qs_log(@"SPECIFIERS_BUILT count=%lu\n", (unsigned long)[sp count]);
              }
              @try { [self setValue:sp forKey:@"_specifiers"]; } @catch (NSException *e) {}
              return sp;
          }

          __attribute__((constructor))
          static void qs_prefs_bundle_init(void) {
              qs_log(@"PREFS_BUNDLE_LOADED pid=%d\n", getpid());
              Class ps = NSClassFromString(@"PSListController");
              if (!ps) { qs_log(@"NO_PSLISTCONTROLLER\n"); return; }
              // bundleForClass swizzle：让动态类关联到本 bundle（loadSpecifiersFromPlistName 依赖）
              Method mb = class_getClassMethod([NSBundle class], @selector(bundleForClass:));
              if (mb) {
                  qs_orig_bundleForClass = (NSBundle *(*)(Class, SEL, Class))method_getImplementation(mb);
                  method_setImplementation(mb, (IMP)qs_swz_bundleForClass);
                  qs_log(@"BUNDLE_SWIZZLED\n");
              } else {
                  qs_log(@"BUNDLE_SWIZZLE_FAIL\n");
              }
              // setPreferenceValue swizzle：开关写入保底 + 日志
              Method m = class_getInstanceMethod(ps, NSSelectorFromString(@"setPreferenceValue:specifier:"));
              if (m) {
                  qs_orig_setpref = method_getImplementation(m);
                  method_setImplementation(m, (IMP)qs_swz_setpref);
                  qs_log(@"SET_SWIZZLED\n");
              } else {
                  qs_log(@"SET_METHOD_MISSING\n");
              }
              // readPreferenceValue swizzle：开关读回（非 qs_ spec 走 original）
              Method mr = class_getInstanceMethod(ps, NSSelectorFromString(@"readPreferenceValue:"));
              if (mr) {
                  qs_orig_readpref = method_getImplementation(mr);
                  method_setImplementation(mr, (IMP)qs_readpref);
                  qs_log(@"READ_SWIZZLED\n");
              } else {
                  qs_log(@"READ_METHOD_MISSING\n");
              }
              // cellForRow 渲染探针：打印真实渲染 cell 类（iOS17 枚举校准）
              Method mc = class_getInstanceMethod(ps, @selector(tableView:cellForRowAtIndexPath:));
              if (mc) {
                  qs_orig_cellForRow = method_getImplementation(mc);
                  method_setImplementation(mc, (IMP)qs_swz_cellForRow);
                  qs_log(@"CELL_SWIZZLED\n");
              } else {
                  qs_log(@"CELL_METHOD_MISSING\n");
              }
              // v0.4.88: didSelect swizzle —— 拦截"目标应用"入口行，手动 push 自绘子页
              Method md = class_getInstanceMethod(ps, @selector(tableView:didSelectRowAtIndexPath:));
              if (md) {
                  qs_orig_didSelect = method_getImplementation(md);
                  method_setImplementation(md, (IMP)qs_swz_didSelect);
                  qs_log(@"DIDSEL_SWIZZLED\n");
              } else {
                  qs_log(@"DIDSEL_METHOD_MISSING\n");
              }
              // 初始化默认值（CFPreferences，cfprefsd 落盘；仅未设置时写入）
              {
                  NSDictionary *def = @{ @"enabled": @YES, @"targets": @"", @"halfSnap": @YES,
                                         @"edgeSnap": @YES, @"screenHide": @YES, @"closeBtn": @YES };
                  for (NSString *k in def) {
                      if (!CFPreferencesCopyAppValue((__bridge CFStringRef)k, CFSTR("com.qingsplit.poc"))) {
                          CFPreferencesSetAppValue((__bridge CFStringRef)k, (__bridge CFPropertyListRef)def[k], CFSTR("com.qingsplit.poc"));
                      }
                  }
                  CFPreferencesAppSynchronize(CFSTR("com.qingsplit.poc"));
                  qs_log(@"CFG_DEFAULT_WRITTEN\n");
                  // v0.4.69: 默认文件只在【不存在】时初始化；存在则绝不覆盖（防止 target_* 丢失）
                  @try {
                      NSString *path = qs_cfg_path();
                      NSFileManager *fm = [NSFileManager defaultManager];
                      if (![fm fileExistsAtPath:path]) {
                          NSMutableDictionary *pd = [NSMutableDictionary dictionary];
                          for (NSString *k in def) {
                              if (!pd[k]) pd[k] = def[k];
                          }
                          if ([pd writeToFile:path atomically:YES]) {
                              qs_log(@"FILE_DEFAULT_INIT keys=%lu\n", (unsigned long)[pd count]);
                          } else {
                              qs_log(@"FILE_DEFAULT_FAIL\n");
                          }
                      } else {
                          qs_log(@"FILE_DEFAULT_SKIP exists\n");
                      }
                  } @catch (NSException *e) { qs_log(@"FILE_DEFAULT_EXC %@\n", e.name); }
              }
              Class sub = objc_allocateClassPair(ps, "QingSplitPrefsRootListController", 0);
              if (sub) {
                  class_addMethod(sub, @selector(specifiers), (IMP)qs_specifiers, "@@:");
                  objc_registerClassPair(sub);
                  qs_log(@"CLASS_REGISTERED QingSplitPrefsRootListController\n");
                  // v0.4.88: 自绘子页（UITableViewController —— 完全脱离 Settings spec 渲染/详情 push 机制）
                  Class tvc = objc_allocateClassPair([UITableViewController class], "QSTargetsListController", 0);
                  if (tvc) {
                      class_addMethod(tvc, @selector(initWithStyle:), (IMP)qs_t_init_style, "@@:i");
                      class_addMethod(tvc, @selector(numberOfSectionsInTableView:), (IMP)qs_t_numSec, "l@:@");
                      class_addMethod(tvc, @selector(tableView:numberOfRowsInSection:), (IMP)qs_t_numRows, "l@:@@");
                      class_addMethod(tvc, @selector(tableView:cellForRowAtIndexPath:), (IMP)qs_t_cell, "@@:@@");
                      objc_registerClassPair(tvc);
                      qs_log(@"CLASS_REGISTERED QSTargetsListController\n");
                  }
                  // 主页 controller 增加入口 action 方法
                  Class mainC = NSClassFromString(@"QingSplitPrefsRootListController");
                  if (mainC) {
                      class_addMethod(mainC, @selector(qs_open_targets:), (IMP)qs_open_targets, "v@:@");
                  }
              } else {
                  qs_log(@"CLASS_EXISTS\n");
              }
              // v0.4.65: QSTargetsController 子页废弃（iOS17 CFSet 检查崩溃），目标应用开关内嵌主设置页
          }
          EOF
          # v0.4.44: 编译 fat 双架构（arm64 + arm64e，对齐 FloatingView universal binary），再 lipo 合成
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -Xlinker -fixup_chains \
            QingSplitPrefsRootListController.m \
            -framework Foundation \
            -framework UIKit \
            -o QingSplitPrefs_arm64.dylib
          xcrun --sdk iphoneos clang \
            -arch arm64e \
            -isysroot "$SDK" \
            -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -Xlinker -fixup_chains \
            QingSplitPrefsRootListController.m \
            -framework Foundation \
            -framework UIKit \
            -o QingSplitPrefs_arm64e.dylib
          lipo -create QingSplitPrefs_arm64.dylib QingSplitPrefs_arm64e.dylib -output QingSplitPrefs.bundle/QingSplitPrefs
          ldid -S QingSplitPrefs.bundle/QingSplitPrefs
          file QingSplitPrefs.bundle/QingSplitPrefs
          ls -l QingSplitPrefs.bundle/

      - name: Package deb (var/jb rootless layout)
        run: |
          python3 package.py

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingSplitPOC-deb
          path: |
            QingSplitPOC_0.4.89_iphoneos-arm64e.deb
          if-no-files-found: warn
