name: Build QingSplitPOC (arm64e new-ABI)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ldid
        run: |
          brew install ldid make

      - name: Show Xcode & SDK
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile arm64e (new ABI) dylib with Xcode clang/ld
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"
          export SDKROOT="$SDK"

          # 编译 ObjC 源文件为 arm64e 目标文件
          xcrun --sdk iphoneos clang \
            -arch arm64e \
            -isysroot "$SDK" \
            -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -fmodules \
            -c QingSplitPOC.m \
            -o QingSplitPOC.o

          # 用 Xcode 原生 ld 链接出 dylib（带 chained fixups / caps 0x2）
          xcrun --sdk iphoneos clang \
            -arch arm64e \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -Xlinker -fixup_chains \
            -install_name "/Library/MobileSubstrate/DynamicLibraries/QingSplitPOC.dylib" \
            -framework Foundation \
            -framework UIKit \
            QingSplitPOC.o \
            -o QingSplitPOC.dylib

          echo "=== dylib 架构验证（期望 arm64e / caps: 0x2）==="
          file QingSplitPOC.dylib
          echo "=== 检查 load commands（看是否有 LC_DYLD_CHAINED_FIXUPS）==="
          otool -l QingSplitPOC.dylib | grep -A2 -i "chained"

      - name: Sign dylib
        run: |
          ldid -S QingSplitPOC.dylib

      # v0.4.42: PreferenceBundles 可执行 —— 动态继承 PSListController（无私有头依赖），
      # 输出到 bundle 内（bundle 可执行须与 bundle 同名、无扩展名）
      # v0.4.42 修复白屏：PSCellType 是 int 枚举（PSGroupCell=8/PSSwitchCell=4/PSEditTextCell=2），
      # 之前传 NSString 在 arm64 上截断成随机 int → PSSpecifier 渲染异常 → 白屏；
      # 另加 /var/mobile/QingSplitPrefs.log 调试日志区分 dlopen 失败 / 类渲染失败
      - name: Build PreferenceBundle executable
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cat > QingSplitPrefsRootListController.m <<'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/message.h>
          #import <objc/runtime.h>
          #import <stdarg.h>

          static void qs_log(NSString *fmt, ...) {
              @try {
                  va_list ap; va_start(ap, fmt);
                  NSString *msg = [[NSString alloc] initWithFormat:fmt arguments:ap];
                  va_end(ap);
                  msg = [msg stringByAppendingString:@"\n"];
                  NSFileHandle *fh = [NSFileHandle fileHandleForWritingAtPath:@"/var/mobile/QingSplitPrefs.log"];
                  if (!fh) {
                      [msg writeToFile:@"/var/mobile/QingSplitPrefs.log" atomically:YES encoding:NSUTF8StringEncoding error:NULL];
                  } else {
                      [fh seekToEndOfFile];
                      [fh writeData:[msg dataUsingEncoding:NSUTF8StringEncoding]];
                      [fh closeFile];
                  }
              } @catch (NSException *e) {}
          }

          // v0.4.47: 回退全量构造（preferenceSpecifierNamed: 存在且 v0.4.45 渲染正常）
          // crash 根因：v0.4.46 的便捷方法 switchSpecifierWithTitle:/groupSpecifierWithName: 在 iOS 17 不存在 → unrecognized selector → Settings 闪退
          // cell 枚举用 v0.4.45 实测值：4=switch（真开关）、8=group、2=link
          // 目标 App 改 link(2)+PSChildPaneSpecifier+file=Targets → 子页 plist 由 framework 原生解析（PSEditTextCell 字符串映射绝对正确）
          // 开关：覆写 setPreferenceValue:specifier: 记 SET_CALLED + 手动写 defaults 保底 + 调 super
          static id qs_prop(id spec, id value, NSString *key) {
              void (*setProp)(id, SEL, id, id) = (void(*)(id, SEL, id, id))objc_msgSend;
              setProp(spec, NSSelectorFromString(@"setProperty:forKey:"), value, key);
          }
          static id qs_mk(Class PS, id name, id target, SEL setSel, SEL getSel, Class detail, int cell) {
              SEL mkSel = NSSelectorFromString(@"preferenceSpecifierNamed:target:set:get:detail:cell:edit:");
              if (![PS respondsToSelector:mkSel]) { qs_log(@"MK_MISSING preferenceSpecifierNamed\n"); return nil; }
              id (*mk)(id, SEL, id, id, SEL, SEL, id, int, id) = (id(*)(id, SEL, id, id, SEL, SEL, id, int, id))objc_msgSend;
              return mk(PS, mkSel, name, target, setSel, getSel, detail, cell, nil);
          }
          static id qs_switch_spec(Class PS, id target, SEL setSel, SEL getSel, NSString *label, NSString *key) {
              id s = qs_mk(PS, label, target, setSel, getSel, nil, 4);   // 4=switch（v0.4.45 实测）
              if (!s) { qs_log(@"SWITCH_BUILD_FAIL %@\n", key); return nil; }
              qs_prop(s, key, @"key");
              qs_prop(s, @"com.qingsplit.poc", @"defaults");
              qs_prop(s, @YES, @"default");
              return s;
          }
          static id qs_group_spec(Class PS, id target, SEL setSel, SEL getSel, NSString *footer) {
              id g = qs_mk(PS, @"", target, setSel, getSel, nil, 8);     // 8=group（v0.4.45 实测）
              if (!g) { qs_log(@"GROUP_BUILD_FAIL\n"); return nil; }
              if (footer.length) qs_prop(g, footer, @"footerText");
              return g;
          }
          // 开关写入覆写：记录 + 手动写 defaults 保底 + 调 PSListController 原实现
          static void qs_set_value(id self, SEL _cmd, id value, id spec) {
              @try {
                  id key = [spec performSelector:@selector(propertyForKey:) withObject:@"key"];
                  id defaults = [spec performSelector:@selector(propertyForKey:) withObject:@"defaults"];
                  qs_log(@"SET_CALLED key=%@ val=%@ defaults=%@\n", key, value, defaults);
                  if (key && defaults) {
                      NSUserDefaults *ud = [[NSUserDefaults alloc] initWithSuiteName:defaults];
                      [ud setObject:value forKey:key];
                      [ud synchronize];
                  }
              } @catch (NSException *e) { qs_log(@"SET_EXC %@\n", e.name); }
              Class ps = NSClassFromString(@"PSListController");
              if (ps) {
                  struct objc_super su = { self, ps };
                  ((void(*)(struct objc_super *, SEL, id, id))objc_msgSendSuper)(&su, _cmd, value, spec);
              }
          }
          static id qs_specifiers(id self, SEL _cmd) {
              qs_log(@"SPECIFIERS_CALLED pid=%d\n", getpid());
              id sp = nil;
              @try { sp = [self valueForKey:@"_specifiers"]; } @catch (NSException *e) { sp = nil; }
              if (!sp) {
                  Class PS = NSClassFromString(@"PSSpecifier");
                  if (PS) {
                      SEL setSel = NSSelectorFromString(@"setPreferenceValue:specifier:");
                      SEL getSel = NSSelectorFromString(@"readPreferenceValue:");

                      id g1 = qs_group_spec(PS, self, setSel, getSel, @"类 Stheno 浮动窗口（POC）。修改设置后需重启 SpringBoard 生效。");
                      id sw = qs_switch_spec(PS, self, setSel, getSel, @"启用悬浮窗", @"enabled");

                      // 目标 App：link(2) + PSChildPaneSpecifier → 子页 Targets.plist（framework 原生解析）
                      id tf = qs_mk(PS, @"目标 App", self, NULL, NULL, NSClassFromString(@"PSChildPaneSpecifier"), 2);
                      if (tf) {
                          qs_prop(tf, @"Targets", @"file");
                      } else {
                          qs_log(@"TARGET_LINK_BUILD_FAIL\n");
                      }

                      id g2 = qs_group_spec(PS, self, setSel, getSel, @"窗口行为");
                      id h = qs_switch_spec(PS, self, setSel, getSel, @"半屏吸附", @"halfSnap");
                      id e = qs_switch_spec(PS, self, setSel, getSel, @"边缘吸附", @"edgeSnap");
                      id sh = qs_switch_spec(PS, self, setSel, getSel, @"主屏回退", @"screenHide");
                      id cb = qs_switch_spec(PS, self, setSel, getSel, @"关闭按钮", @"closeBtn");

                      NSMutableArray *arr = [NSMutableArray array];
                      if (g1) [arr addObject:g1]; else qs_log(@"GROUP_MISSING g1\n");
                      if (sw) [arr addObject:sw]; else qs_log(@"SWITCH_MISSING enabled\n");
                      if (tf) [arr addObject:tf]; else qs_log(@"EDIT_MISSING targets\n");
                      if (g2) [arr addObject:g2]; else qs_log(@"GROUP_MISSING g2\n");
                      if (h) [arr addObject:h]; else qs_log(@"SWITCH_MISSING halfSnap\n");
                      if (e) [arr addObject:e]; else qs_log(@"SWITCH_MISSING edgeSnap\n");
                      if (sh) [arr addObject:sh]; else qs_log(@"SWITCH_MISSING screenHide\n");
                      if (cb) [arr addObject:cb]; else qs_log(@"SWITCH_MISSING closeBtn\n");
                      sp = arr;
                      qs_log(@"SPECIFIERS_BUILT count=%lu\n", (unsigned long)[sp count]);
                  } else {
                      qs_log(@"NO_PSSPECIFIER_CLASS\n");
                      sp = @[];
                  }
                  if (!sp) sp = @[];
                  @try { [self setValue:sp forKey:@"_specifiers"]; } @catch (NSException *e) {}
              }
              return sp;
          }

          __attribute__((constructor))
          static void qs_prefs_bundle_init(void) {
              qs_log(@"PREFS_BUNDLE_LOADED pid=%d\n", getpid());
              Class ps = NSClassFromString(@"PSListController");
              if (!ps) { qs_log(@"NO_PSLISTCONTROLLER\n"); return; }
              Class sub = objc_allocateClassPair(ps, "QingSplitPrefsRootListController", 0);
              if (sub) {
                  class_addMethod(sub, @selector(specifiers), (IMP)qs_specifiers, "@@:");
                  // v0.4.47: 覆写 setPreferenceValue:specifier:（开关写入可观测 + 保底）
                  class_addMethod(sub, NSSelectorFromString(@"setPreferenceValue:specifier:"), (IMP)qs_set_value, "v@:@@");
                  objc_registerClassPair(sub);
                  qs_log(@"CLASS_REGISTERED QingSplitPrefsRootListController\n");
              } else {
                  qs_log(@"CLASS_EXISTS\n");
              }
          }
          EOF
          # v0.4.44: 编译 fat 双架构（arm64 + arm64e，对齐 FloatingView universal binary），再 lipo 合成
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -Xlinker -fixup_chains \
            QingSplitPrefsRootListController.m \
            -framework Foundation \
            -framework UIKit \
            -o QingSplitPrefs_arm64.dylib
          xcrun --sdk iphoneos clang \
            -arch arm64e \
            -isysroot "$SDK" \
            -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -Xlinker -fixup_chains \
            QingSplitPrefsRootListController.m \
            -framework Foundation \
            -framework UIKit \
            -o QingSplitPrefs_arm64e.dylib
          lipo -create QingSplitPrefs_arm64.dylib QingSplitPrefs_arm64e.dylib -output QingSplitPrefs.bundle/QingSplitPrefs
          ldid -S QingSplitPrefs.bundle/QingSplitPrefs
          file QingSplitPrefs.bundle/QingSplitPrefs
          ls -l QingSplitPrefs.bundle/

      - name: Package deb (var/jb rootless layout)
        run: |
          python3 package.py

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingSplitPOC-deb
          path: |
            QingSplitPOC_0.4.47_iphoneos-arm64e.deb
          if-no-files-found: warn
